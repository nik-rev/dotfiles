# Packages that pixi does not provide, installed by the scripts in
# .chezmoiscripts. Editing this file makes `chezmoi apply` run them again.
#
# CLI tools on every platform come from pixi instead, see
# dot_pixi/manifests/pixi-global.toml.tmpl. Graphical applications on
# Fedora Atomic come from Flathub, see flatpaks.txt

# Windows applications, from winget. Zed on macOS comes from its installer
[windows]
winget = ["Git.Git", "ZedIndustries.Zed.Preview"]

# Nightly Rust, installed with rustup into the rust-env pixi environment,
# see dot_local/share/rust-env/pixi.toml. The cargo config needs these
# components. `enabled = false` stops installing Rust; the environment in
# ~/.local/share/rust-env can then be deleted
[rust]
enabled = true
components = ["rust-src", "rust-analyzer", "rustc-codegen-cranelift-preview"]
# Installed with `cargo install`. wild only supports Linux
cargo_linux = ["wild-linker"]
