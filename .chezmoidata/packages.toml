# Packages that pixi doesn't have. The scripts in .chezmoiscripts install
# them, and they run again whenever this file changes.
#
# CLI tools come from pixi on every platform instead (see
# dot_pixi/manifests/pixi-global.toml.tmpl), and graphical apps on Fedora
# Atomic come from Flathub (see flatpaks.txt)

# Fedora Atomic only. Layered packages get added to the system image with
# rpm-ostree, because the COSMIC image doesn't ship them yet, and they take
# effect after a reboot. Once Fedora includes one in the image, setup tells
# me, and then I remove it here and run `rpm-ostree uninstall <package>`.
#
# With `only_with`, a package is skipped unless that other one is installed.
[fedora]

# Flathub extensions. `flatpak list --app` doesn't show these, so
# sync-packages.sh doesn't either. The QEMU extension lets virt-manager run
# virtual machines on its own, without libvirt on the system
flatpak_extensions = ["org.virt_manager.virt_manager.Extension.Qemu"]

# The Secret portal, which lets flatpak apps store passwords in the
# keyring. COSMIC already expects it, but the image only
# ships the keyring itself (oo7-daemon). Images with gnome-keyring instead,
# like secureblue, don't need it, because gnome-keyring is the portal there
[[fedora.layered]]
package = "oo7-portal"
only_with = "oo7-daemon"

# Turns displays off and on without disconnecting them (Super+F12). The
# monitor's power button also cuts the Thunderbolt dock built into it, and
# its firmware can get stuck when it comes back
[[fedora.layered]]
package = "wlopm"

# Windows applications, from winget
[windows]
winget = ["Git.Git", "BlenderFoundation.Blender"]
# Apps that are only in the Microsoft Store, which winget can install from too
msstore = [
    "9P5BJXV6044Z", # Lockbook
]

# Nightly Rust, installed with rustup into the rust-env pixi environment (see
# dot_local/share/rust-env/pixi.toml). My cargo config needs these
# components. Setting `enabled = false` stops Rust from being installed, and
# then ~/.local/share/rust-env can be deleted
[rust]
enabled = true
components = ["rust-src", "rust-analyzer", "rustc-codegen-cranelift-preview"]
# Installed with `cargo install`. wild is Linux-only
cargo_linux = ["wild-linker"]
