# Packages that pixi does not provide, installed by the scripts in
# .chezmoiscripts. Editing this file makes `chezmoi apply` run them again.
#
# CLI tools on every platform come from pixi instead, see
# dot_pixi/manifests/pixi-global.toml.tmpl. Graphical applications on
# Fedora Atomic come from Flathub, see flatpaks.txt

# Fedora Atomic only: packages layered onto the system image with
# rpm-ostree, because the COSMIC image does not ship them yet. Layering
# takes effect after a reboot. Setup reminds you when Fedora includes one in
# the image: then remove it here and run `rpm-ostree uninstall <package>`.
#
# `only_with` skips a package unless another one is installed.
[fedora]

# Flathub extensions, which `flatpak list --app` (and so
# sync-packages.sh) does not list. The QEMU extension lets virt-manager run
# virtual machines itself, without libvirt installed on the system
flatpak_extensions = ["org.virt_manager.virt_manager.Extension.Qemu"]

# The Secret portal, so flatpak apps like Proton Pass can store
# passwords in the keyring. COSMIC already expects it, but the image only
# ships the keyring (oo7-daemon) without it. Images with gnome-keyring
# instead, like secureblue, do not need it: gnome-keyring is the portal
[[fedora.layered]]
package = "oo7-portal"
only_with = "oo7-daemon"

# Windows applications, from winget
[windows]
winget = ["Git.Git"]

# Nightly Rust, installed with rustup into the rust-env pixi environment,
# see dot_local/share/rust-env/pixi.toml. The cargo config needs these
# components. `enabled = false` stops installing Rust; the environment in
# ~/.local/share/rust-env can then be deleted
[rust]
enabled = true
components = ["rust-src", "rust-analyzer", "rustc-codegen-cranelift-preview"]
# Installed with `cargo install`. wild only supports Linux
cargo_linux = ["wild-linker"]
